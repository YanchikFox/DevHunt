# Rate limit zones for edge protection (included in http context via conf.d)
limit_req_zone $binary_remote_addr zone=auth_api_limit:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=auth_api_conn:10m;
limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=public_api_conn:10m;
