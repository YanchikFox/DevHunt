# Nginx HTTP-only configuration for DevHunt (no SSL)
# Use this when deploying without a domain/SSL certificate
# For production with domain, use nginx.conf with Let's Encrypt

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default "";
    "websocket" "upgrade";
}

map $http_upgrade $websocket_upgrade {
    default "";
    "websocket" "websocket";
}

# DNS resolver for Docker container name resolution
# valid=10s - re-resolve every 10 seconds (prevents 502 after container rebuild)
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP server (production without SSL - use with IP address)
server {
    listen 8080;
    server_name _;

    include /etc/nginx/conf.d/edge-security.inc;

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location = /portal {
        return 301 /portal/;
    }

    location /portal/ {
        set $upstream_documentation documentation:80;
        proxy_pass http://$upstream_documentation;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }

    # Frontend (Next.js)
    location / {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_cache_bypass $http_upgrade;

        # WebSocket support
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $websocket_upgrade;
    }

    # Auth Service API - Routed to Frontend because NextAuth handlers live at /api/auth/*
    # Real Auth Service is accessed by Frontend via internal Docker network or /api/proxy-auth/
    location /api/auth/ {
        limit_req zone=auth_api_limit burst=15 nodelay;
        limit_conn auth_api_conn 30;
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }

    # Next.js API proxy routes - must go to frontend, not core-api
    location /api/proxy-auth/ {
        limit_req zone=auth_api_limit burst=15 nodelay;
        limit_conn auth_api_conn 30;
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }

    location /api/proxy-core/ {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }

    location /api/proxy-ml/ {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }

    # Core API (direct access, without proxy prefix)
    location /api/ {
        limit_req zone=public_api_limit burst=40 nodelay;
        limit_conn public_api_conn 50;
        set $upstream_core core-api:8080;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }

    # SignalR Hubs - WebSocket endpoints
    location /chatHub {
        set $upstream_core core-api:8080;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_read_timeout 86400;

        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $websocket_upgrade;
    }

    location /notificationHub {
        set $upstream_core core-api:8080;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_read_timeout 86400;

        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $websocket_upgrade;
    }
}
