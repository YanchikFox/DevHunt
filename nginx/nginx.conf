# Nginx reverse proxy configuration for DevHunt
# Provides TLS termination and routing

# Map for WebSocket connection upgrade - restrict to websocket only to prevent H2C smuggling
map $http_upgrade $connection_upgrade {
    default "";
    "websocket" "upgrade";
}

# Map for WebSocket upgrade header - use hardcoded value to prevent H2C smuggling
map $http_upgrade $websocket_upgrade {
    default "";
    "websocket" "websocket";
}

# DNS resolver for dynamic resolution имен контейнеров
# valid=10s - перерезолвить каждые 10 секунд (защита от 502 при пересборке контейнеров)
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP to HTTPS redirect
server {
    listen 8080;
    server_name _;
    
    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (only if certificates exist)
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # SSL certificates (Let's Encrypt in production, self-signed for dev)
    # Will be created by Dockerfile or Let's Encrypt
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # SSL configuration (Production-ready)
    ssl_protocols TLSv1.2 TLSv1.3;
    # Modern cipher suites only (exclude weak ciphers)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling (for better performance and privacy)
    # Requires valid SSL certificate with OCSP support
    # Uncomment when using Let's Encrypt certificates with chain file
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;  # Certificate chain from Let's Encrypt
    
    # HSTS (HTTP Strict Transport Security) - already in headers, but also here for clarity
    # max-age=31536000 = 1 year
    
    include /etc/nginx/conf.d/edge-security.inc;

    # HSTS only on HTTPS terminator
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    location = /portal {
        return 301 /portal/;
    }

    location /portal/ {
        set $upstream_documentation documentation:80;
        proxy_pass http://$upstream_documentation;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }

    # Frontend (Next.js)
    location / {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id ""; # Strip spoofed user identity headers at the edge
        proxy_cache_bypass $http_upgrade;

        # WebSocket support with H2C smuggling protection
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $websocket_upgrade;
    }
    
    # Auth Service API
    location /api/auth/ {
        limit_req zone=auth_api_limit burst=15 nodelay;
        limit_conn auth_api_conn 30;
        set $upstream_auth auth-service:8080;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
    }
    
    # Core API
    location /api/ {
        limit_req zone=public_api_limit burst=40 nodelay;
        limit_conn public_api_conn 50;
        set $upstream_core core-api:8080;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";

        # Do not forward Upgrade header here - WebSocket is handled by specific /chatHub and /notificationHub endpoints
    }
    
    # SignalR Hubs - WebSocket endpoints (Upgrade header is required here)
    # Only allow websocket upgrade to prevent H2C smuggling
    location /chatHub {
        set $upstream_core core-api:8080;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_read_timeout 86400;

        # WebSocket support with H2C smuggling protection - use hardcoded value
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $websocket_upgrade;
    }

    location /notificationHub {
        set $upstream_core core-api:8080;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_read_timeout 86400;

        # WebSocket support with H2C smuggling protection - use hardcoded value
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $websocket_upgrade;
    }
}

