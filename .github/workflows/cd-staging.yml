name: CD - Deploy to Staging

on:
  # Disabled auto-triggers to save CI minutes
  # push:
  #   branches: [ develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.devhunt.example.com
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=staging-
    
    - name: Build and push Core API
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./DevHunt.CoreApi/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/core-api:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build and push Auth Service
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./DevHunt.AuthService/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/auth-service:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment"
        # Здесь будет команда для деплоя (kubectl, docker-compose, etc.)
        # Пример:
        # kubectl set image deployment/core-api core-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/core-api:${{ github.sha }} -n staging
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests"
        # Здесь будут smoke tests для проверки работоспособности
        # curl -f https://staging.devhunt.example.com/health || exit 1

