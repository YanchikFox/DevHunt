name: Infrastructure as Code Security (Checkov)

on:
  # Removed push trigger to save CI minutes
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docker-compose*.yml'
      - 'k8s/**'
      - '**/Dockerfile'
      - '.checkov.yaml'
  workflow_dispatch: # Manual trigger
    inputs:
      verbose_logs:
        description: 'Upload job logs as artifact'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          mkdir -p ${{ github.workspace }}/logs
          set -o pipefail
          checkov -d . \
            --framework dockerfile,kubernetes \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-results.sarif \
            --soft-fail \
            --download-external-modules true \
            --skip-check CKV_DOCKER_2 \
            2>&1 | tee ${{ github.workspace }}/logs/checkov.log
        continue-on-error: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif
          wait-for-processing: false

      - name: Upload job logs
        if: always() && inputs.verbose_logs == true
        uses: actions/upload-artifact@v7
        with:
          name: iac-checkov-logs
          path: ${{ github.workspace }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  kubesec:
    name: Kubesec Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Find Kubernetes manifests
        id: find-k8s
        run: |
          # Use heredoc to properly escape multiline output
          files=$(find k8s -name "*.yaml" -o -name "*.yml" 2>/dev/null | head -20 || echo "")
          echo "found=$([[ -n "$files" ]] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

      - name: Run Kubesec
        if: steps.find-k8s.outputs.found == 'true'
        run: |
          mkdir -p ${{ github.workspace }}/logs
          set -o pipefail
          {
            # Scan each file individually
            for file in $(find k8s -name "*.yaml" -o -name "*.yml" 2>/dev/null | head -20); do
              echo "Scanning $file..."
              docker run --rm -v "${{ github.workspace }}:/workspace" \
                kubesec/kubesec:latest \
                scan "/workspace/$file" || true
            done
          } 2>&1 | tee ${{ github.workspace }}/logs/kubesec.log

      - name: Upload job logs
        if: always() && inputs.verbose_logs == true
        uses: actions/upload-artifact@v7
        with:
          name: iac-kubesec-logs
          path: ${{ github.workspace }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  kics:
    name: KICS Multi-IaC Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run KICS scan
        uses: Checkmarx/kics-github-action@v2.1.3
        with:
          path: .
          output_path: kics-results
          output_formats: 'sarif,json'
          fail_on: high
          enable_comments: true
        continue-on-error: true

      - name: Upload KICS SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('kics-results/results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: kics-results/results.sarif
          wait-for-processing: false

      - name: Upload KICS results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kics-results
          path: kics-results/
          retention-days: 30

      - name: Upload job logs
        if: always() && inputs.verbose_logs == true
        uses: actions/upload-artifact@v7
        with:
          name: iac-kics-logs
          path: kics-results/
          if-no-files-found: ignore
          retention-days: 7
