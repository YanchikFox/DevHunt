sonar.projectKey=YanchikFox_DevHunt
sonar.organization=yanchikfox

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=DevHunt
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# Only scan actual source directories instead of entire repo
sonar.sources=DevHunt.AuthService,DevHunt.CoreApi,DevHunt.Infrastructure,DevHunt.DatabaseMigrator,DevHunt.DatabaseSeeder,frontend/src,ml-service

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Languages (multi-language project)
sonar.languages=cs,js,ts,py

# Exclusions for build artifacts and dependencies
sonar.exclusions=\
  **/node_modules/**,\
  **/bin/**,\
  **/obj/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/packages/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/vendor/**,\
  **/*.d.ts,\
  **/Migrations/**,\
  **/migrations/**,\
  **/*.Designer.cs,\
  **/wwwroot/**,\
  **/stories/**,\
  **/*.stories.tsx

# Test file exclusions (from coverage analysis)
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/__tests__/**,\
  **/test/**,\
  **/*.Tests/**,\
  **/DevHunt.*.Tests/**

# Duplicate code detection exclusions
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/Migrations/**,\
  **/migrations/**,\
  **/*.Designer.cs