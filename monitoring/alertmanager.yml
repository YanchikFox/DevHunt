global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default-receiver'
    # В production здесь будут реальные каналы уведомлений
    webhook_configs:
      - url: 'http://localhost:5003/api/webhooks/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5003/api/webhooks/alerts/critical'
        send_resolved: true
    # В production добавить:
    # email_configs:
    #   - to: 'ops@devhunt.example.com'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/...'

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:5003/api/webhooks/alerts/warning'
      send_resolved: true

