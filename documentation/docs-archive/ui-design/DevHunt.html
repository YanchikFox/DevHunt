<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevHunt — Build. Match. Ship.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="core.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="projects.jsx"></script>
<script type="text/babel" src="features.jsx"></script>
<script type="text/babel" src="search.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

function App() {
  // Entry: landing -> auth -> app
  const [entered, setEntered] = useLocalState('dh:entered', false);
  const [authed, setAuthed] = useLocalState('dh:authed', false);
  const [route, setRoute] = useLocalState('dh:route', 'home');
  const [theme, setTheme] = useLocalState('dh:theme', 'light');
  const [tweaks, setTweaks] = useLocalState('dh:tweaks', TWEAKS_DEFAULT);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);

  // Enable tweaks toggle from host
  useEffect(() => {
    const onMsg = (e) => {
      const t = e.data?.type;
      if (t === '__activate_edit_mode') setTweaksOpen(true);
      if (t === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // Global ⌘K / Ctrl+K → search
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setRoute('search');
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Apply theme + tweaks to <html>
  useEffect(() => {
    const html = document.documentElement;
    html.setAttribute('data-theme', theme);
    html.style.setProperty('--d', tweaks.density);
    html.style.setProperty('--accent', `oklch(0.58 0.22 ${tweaks.accentHue})`);
    html.style.setProperty('--accent-hover', `oklch(0.52 0.22 ${tweaks.accentHue})`);
    html.style.setProperty('--accent-weak', `oklch(0.58 0.22 ${tweaks.accentHue} / 0.14)`);
    const fonts = FONT_STACKS[tweaks.font] || FONT_STACKS.geist;
    html.style.setProperty('--font-sans', fonts.sans);
    html.style.setProperty('--font-serif', fonts.serif);
    html.style.setProperty('--font-mono', fonts.mono);
  }, [theme, tweaks]);

  if (!entered) return <Landing onEnter={() => setEntered(true)} />;
  if (!authed) return <AuthScreen onEnter={() => setAuthed(true)} />;

  const baseRoute = (route || 'home').split('/')[0];
  const projectId = (route || '').split('/')[1] || 'p1';

  const CurrentPage = () => {
    switch (baseRoute) {
      case 'home': return <HomeDashboard setRoute={setRoute} />;
      case 'projects':
        return route.includes('/') ?
          <ProjectDetail projectId={projectId} setRoute={setRoute} cardStyle={tweaks.cardStyle} /> :
          <ProjectsList setRoute={setRoute} cardStyle={tweaks.cardStyle} />;
      case 'board': return <KanbanBoard setRoute={setRoute} projectId={projectId || 'p1'} />;
      case 'ai': return <AIPlan />;
      case 'community': return <Community cardStyle={tweaks.cardStyle} />;
      case 'chat': return <ChatScreen />;
      case 'profile':
        return route === 'profile/edit'
          ? <ProfileEditPage setRoute={setRoute} />
          : <Profile setRoute={setRoute} />;
      case 'settings': return <SettingsPage setRoute={setRoute} theme={theme} setTheme={setTheme} tweaks={tweaks} setTweaks={setTweaks} />;
      case 'admin': return <Admin />;
      case 'notifications': return <Notifications />;
      case 'search': return <SearchPage setRoute={setRoute} />;
      default: return <HomeDashboard setRoute={setRoute} />;
    }
  };

  const layoutClass =
    tweaks.layout === 'topbar' ? 'topbar-layout' :
    tweaks.layout === 'compact' ? 'compact-rail' : '';

  return (
    <div className={'app-shell ' + layoutClass} data-screen-label={baseRoute}>
      {tweaks.layout === 'topbar' ? (
        <TopbarNav route={baseRoute} setRoute={setRoute} theme={theme} setTheme={setTheme} setMobileOpen={setMobileOpen} />
      ) : (
        <Sidebar route={baseRoute} setRoute={setRoute} compact={tweaks.layout === 'compact'} />
      )}
      <main style={{ display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>
        {tweaks.layout !== 'topbar' && (
          <Topbar route={baseRoute} setRoute={setRoute} theme={theme} setTheme={setTheme} setMobileOpen={setMobileOpen} />
        )}
        <div style={{ flex: 1, overflowY: 'auto', minHeight: 0 }}>
          <CurrentPage />
        </div>
      </main>
      <MobileNav route={baseRoute} setRoute={setRoute} open={mobileOpen} setOpen={setMobileOpen} />
      {tweaksOpen && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} onClose={() => setTweaksOpen(false)} />}
      {baseRoute !== 'chat' && <ChatDock onOpenFullChat={() => setRoute('chat')} />}
    </div>
  );
}

// Horizontal topbar-layout nav (used when layout === 'topbar')
function TopbarNav({ route, setRoute, theme, setTheme, setMobileOpen }) {
  return (
    <header style={{
      display: 'flex', alignItems: 'center', gap: 6,
      padding: '10px 18px', borderBottom: '1px solid var(--border)',
      background: 'var(--bg)', minHeight: 56,
    }}>
      <div style={{ marginRight: 14 }}><Logo /></div>
      <nav style={{ display: 'flex', gap: 2, flex: 1, overflowX: 'auto' }} className="no-scrollbar hide-mobile">
        {NAV_ITEMS.map(i => (
          <button key={i.id} onClick={() => setRoute(i.id)} style={{
            display: 'flex', alignItems: 'center', gap: 6,
            padding: '8px 12px', border: 'none',
            background: route === i.id ? 'var(--bg-subtle)' : 'transparent',
            color: route === i.id ? 'var(--text)' : 'var(--text-muted)',
            borderRadius: 'var(--r-md)', fontSize: 12.5, fontWeight: 500,
            whiteSpace: 'nowrap',
          }}>
            <Icon name={i.icon} size={14} /> {i.label}
          </button>
        ))}
      </nav>
      <button className="btn-ghost show-mobile" onClick={() => setMobileOpen(v => !v)} style={{ padding: 8, border: 'none', background: 'transparent' }}>
        <Icon name="menu" size={18} />
      </button>
      <button className="btn-ghost" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} style={{ padding: 8, border: 'none', background: 'transparent' }}>
        <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={16} />
      </button>
      <AvatarMenu setRoute={setRoute} />
    </header>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
