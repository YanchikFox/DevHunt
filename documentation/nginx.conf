server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    include /etc/nginx/conf.d/basic-auth.inc;

    location = / {
        return 302 /portal/;
    }

    location = /portal {
        return 301 /portal/;
    }

    # Serve the Docusaurus build under its configured baseUrl (/portal/).
    location ^~ /portal/ {
        rewrite ^/portal/(.*)$ /$1 break;
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle static files from Docusaurus API docs (swagger.json, etc.)
    # This must come before the general /api/ location
    location ~* ^/api/swagger\.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Handle DocFX static content
    # DocFX is copied from static/docfx to build/docfx by Docusaurus
    location /docfx/ {
        # Try the exact file, then directory with index.html, then fallback
        try_files $uri $uri/ $uri/index.html /docfx/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Allow DocFX to load its assets (CSS, JS, images) - must come before general static assets rule
    location ~* ^/docfx/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle client-side routing for Docusaurus
    # This must handle all routes including /docs/backend/intro/
    # Docusaurus generates pages with trailing slashes, so we need to handle both
    location / {
        # First try exact file, then with trailing slash, then index.html in directory, finally fallback to root index.html
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
